[project]
name = "hema-squire-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    # the IANA zone database, so `zoneinfo` resolves a tournament's timezone on
    # a container carrying no system zone data (design add-registration-open-time D4)
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "schemathesis>=4.26.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "T20", "TID"]

[tool.ruff.lint.isort]
# `alembic/` is the migrations directory, but `alembic` the import is the
# installed package — without this, imports of it are sorted as first-party and
# every migration reports I001.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/**" = [
    # assert is what a test is made of
    "S101",
    # fixtures carry literal passwords, password hashes and Fio tokens. They are
    # fixtures: no deployment reads them and none of them opens anything.
    "S105", "S106", "S107",
    # the migration suites shell out to `alembic upgrade` with a literal argv —
    # no shell, no interpolation
    "S603",
    # migration suites build SQL against table names they wrote themselves,
    # because the ORM models have moved on from the schema under test
    "S608",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# Scope, phase 2 of `openspec/changes/static-analysis-spec.md`. Only `app/` is
# gated. Still outside the gate, to be widened in a later phase:
#   tests/    — the fakes (StubRule, FakeTournament) are passed to functions
#               typed against the real models, so making them check means
#               introducing protocols at those seams, not annotating.
#   scripts/  — seeding and one-off maintenance, not shipped code.
#   alembic/  — generated migrations.
include = ["app"]
exclude = ["**/__pycache__", "**/node_modules"]
