[project]
name = "hema-squire-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    # `app/llm.py` imports it directly, so it is named directly. It also
    # arrives as the `[anthropic]` extra of pydantic-ai-slim, but an extra of
    # another package is that package's promise, not a declaration of ours.
    "anthropic>=0.117.0",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    # same shape as anthropic: `app/routers/tournaments.py` imports PIL to
    # read an uploaded logo, while the `qrcode[pil]` extra below only
    # promises what qrcode itself needs.
    "pillow>=12.3.0",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    # the IANA zone database, so `zoneinfo` resolves a tournament's timezone on
    # a container carrying no system zone data (design add-registration-open-time D4)
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "schemathesis>=4.26.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "T20", "TID"]

[tool.ruff.lint.isort]
# `alembic/` is the migrations directory, but `alembic` the import is the
# installed package — without this, imports of it are sorted as first-party and
# every migration reports I001.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/**" = [
    # assert is what a test is made of
    "S101",
    # fixtures carry literal passwords, password hashes and Fio tokens. They are
    # fixtures: no deployment reads them and none of them opens anything.
    "S105", "S106", "S107",
    # the migration suites shell out to `alembic upgrade` with a literal argv —
    # no shell, no interpolation
    "S603",
    # migration suites build SQL against table names they wrote themselves,
    # because the ORM models have moved on from the schema under test
    "S608",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# Scope, phase 2 of `openspec/changes/static-analysis-spec.md`. `app/` is the
# shipped code; `../scripts/` joined it once its findings were cleared, because
# nothing else type-checks the dev scripts and the two bugs found there —
# an import of a symbol the parser had stopped exporting, and a `str` written
# into a `Mapped[Role]` column — are exactly what this catches for free.
# `tests/` joined them once its fakes were gone: a declarative model builds
# perfectly well without a session, so every stand-in that existed to avoid one
# was replaced by the real thing. Still outside the gate:
#   alembic/  — generated migrations.
include = ["app", "../scripts", "tests"]
exclude = ["**/__pycache__", "**/node_modules"]

# Phase 5 of `openspec/changes/static-analysis-spec.md`. deptry answers one
# question: does what the code imports match what the project declares. It runs
# in CI's `audit` job, which reports and never blocks — the spec marks phase 5
# non-blocking, and every finding here needs a human to say which of the two
# sides is wrong.
[tool.deptry.package_module_name_map]
# Distributions whose import name is not their package name. deptry guesses the
# package name when it cannot import the module, and guesses wrong for these.
pillow = ["PIL"]
pyjwt = ["jwt"]
pydantic-ai-slim = ["pydantic_ai"]

[tool.deptry.per_rule_ignores]
# Declared and never imported, all four on purpose:
#   email-validator  pydantic's EmailStr requires it at validation time
#   python-multipart FastAPI parses UploadFile and Form bodies through it
#   tzdata           zoneinfo reads it as data; there is no module to import
#   uvicorn          the ASGI server, run as a command
DEP002 = ["email-validator", "python-multipart", "tzdata", "uvicorn"]

# vulture, the other half of phase 5, and a manual run by design: the spec keeps
# it out of CI because it cannot see a name that only a decorator, a template or
# pydantic's `from_attributes` reads. `uv run vulture` uses everything below.
#
# What is worth reading is the "unused function/method/class/property" lines;
# the "unused variable/attribute" ones are ~100 handler parameters and columns
# read by name, and filtering them is not worth a whitelist file that nobody
# prunes. One known false positive survives: `Tournament.fio_token_configured`,
# a property that only `TournamentDetail` reads, by name.
[tool.vulture]
# tests, migrations and scripts are scanned as *callers*, so a name only they
# use does not read as dead. Findings in them are not the point.
paths = ["app", "tests", "alembic", "../scripts"]
min_confidence = 60
# Registration by decorator, which vulture reads as a definition nobody calls.
ignore_decorators = [
    "@app.*", "@router.*",
    "@field_validator", "@model_validator", "@field_serializer", "@computed_field",
    "@event.listens_for",
    "@*.get", "@*.post", "@*.patch", "@*.put", "@*.delete",
    "@*.exception_handler", "@*.on_event",
]
