# Local gates, so the checks are seen while working rather than in CI.
# `pre-commit install` once per checkout; CI runs the same tools itself and
# does not depend on this file.
#
# Revisions are managed by `pre-commit autoupdate`, never edited by hand.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # `pass_filenames: false` on all three: type-checking or linting one file
      # in isolation says nothing, the checkers need the whole project.
      - id: basedpyright
        name: basedpyright
        entry: bash -c 'cd backend && uv run basedpyright'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: tsc
        name: tsc --noEmit
        entry: npm run --prefix frontend typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: biome
        name: biome check
        entry: npm run --prefix frontend check
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|jsonc|css)$
        pass_filenames: false
