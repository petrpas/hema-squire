schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

context: |
  Two bounded contexts share this repo.
  Office (pre-tournament): registration, payments, import, export.
  Capabilities without a prefix.
  Floor (tournament day): check-in, pools, brackets, scheduling.
  Capabilities prefixed `floor-`.
  Floor depends on office only through the `floor-roster` capability.

rules:
  proposal:
    - State which context the change belongs to. A change touching both says why.
  specs:
    - A floor change modifies only `floor-*` capabilities.
  design:
    - List every import that crosses the floor boundary.
